<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレさく — ポスター会場ディスプレイ</title>
<style>
  :root { --navy:#0B2545; --accent:#0516B9; --ink2:#334155; --muted:#475569; --line:#CBD5E1; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#F4F7FC; color:var(--navy);
    font-family:"Hiragino Sans","ヒラギノ角ゴシック","Hiragino Kaku Gothic ProN",sans-serif; }
  body.idle { cursor:none; }
  .stage { height:100vh; display:grid; grid-template-columns: 58fr 42fr; }

  /* 左: 案内とQR */
  .info { display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:3vh 3vw; text-align:center; }
  .tag { font-size:2.1vh; font-weight:600; letter-spacing:.12em; color:var(--muted); }
  .brand { display:flex; align-items:center; gap:1.6vw; margin-top:1.2vh; }
  .brand img { width:8.5vh; height:8.5vh; border-radius:1.9vh; }
  .brand .name { font-size:7.6vh; font-weight:800; letter-spacing:.04em; line-height:1; }
  .tagline { font-size:2.8vh; color:var(--ink2); margin-top:1.2vh; }
  .headline { margin-top:2.2vh; font-size:4.4vh; font-weight:800; line-height:1.25; }
  .headline em { font-style:normal; color:var(--accent); }
  .qrbox { margin-top:2vh; padding:1.8vh; background:#fff; border:.9vh solid var(--accent);
    border-radius:2.6vh; box-shadow:0 1.2vh 3vh rgba(11,37,69,.12); }
  .qrbox svg { width:34vh; height:34vh; display:block; }
  .hint { margin-top:1.6vh; font-size:2.2vh; color:var(--muted); }
  .url { margin-top:.2vh; font-size:5vh; font-weight:800; letter-spacing:.03em; }
  .points { margin-top:1.8vh; display:flex; gap:1vw; justify-content:center; }
  .points span { border:.25vh solid #94A3B8; border-radius:1.2vh; padding:.8vh 1.4vw;
    font-size:2.3vh; font-weight:700; color:#1E293B; background:#fff; }
  .foot { margin-top:1.8vh; font-size:2.1vh; color:var(--ink2); }

  /* 右: アプリ画面のスライド */
  .shots { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:3vh 2vw; background:linear-gradient(180deg,#FFFFFF 0%,#EAF0F9 100%); border-left:1px solid var(--line); }
  .frame { position:relative; height:84vh; aspect-ratio:1320/2868; border-radius:2.4vh; overflow:hidden;
    background:#fff; box-shadow:0 1.6vh 4vh rgba(11,37,69,.16), 0 0 0 1px rgba(11,37,69,.06); }
  .frame img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    opacity:0; transition:opacity 1.2s ease; }
  .frame img.on { opacity:1; }
  .dots { margin-top:1.8vh; display:flex; gap:1vh; }
  .dots i { width:1.2vh; height:1.2vh; border-radius:50%; background:#CBD5E1; transition:background .4s; }
  .dots i.on { background:var(--accent); }

  .fs-hint { position:fixed; right:1.2vw; bottom:1.2vh; font-size:1.5vh; color:#94A3B8;
    transition:opacity .6s; }
  body.idle .fs-hint, body.full .fs-hint { opacity:0; }
  @media (prefers-reduced-motion: reduce) { .frame img { transition:none; } }
</style>
</head>

<div class="fs-hint">クリックで全画面表示（Esc で解除）</div>
<script>
  // アプリ画面を6秒ごとに切り替える
  const imgs = [...document.querySelectorAll('.frame img')];
  const dots = [...document.querySelectorAll('.dots i')];
  let i = 0;
  setInterval(() => {
    imgs[i].classList.remove('on'); dots[i].classList.remove('on');
    i = (i + 1) % imgs.length;
    imgs[i].classList.add('on'); dots[i].classList.add('on');
  }, 6000);

  // クリックで全画面の切り替え
  document.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', () =>
    document.body.classList.toggle('full', !!document.fullscreenElement));

  // 3秒操作がなければマウスカーソルを隠す
  let t;
  const wake = () => { document.body.classList.remove('idle'); clearTimeout(t);
    t = setTimeout(() => document.body.classList.add('idle'), 3000); };
  ['mousemove','mousedown','keydown'].forEach(e => document.addEventListener(e, wake));
  wake();
</script>
